<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Settings – Our Nikah Memories Admin</title>
  <meta name="description" content="Configure wedding website details, password, and security preferences." />
  
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="stylesheet" href="/css/animations.css" />
  <link rel="stylesheet" href="/css/admin.css" />
  <link rel="stylesheet" href="/css/responsive.css" />
</head>
<body>
  <div class="admin-layout">
    <!-- Sidebar -->
    <aside class="admin-sidebar">
      <div class="admin-sidebar-header">
        <div class="brand-icon" style="width: 32px; height: 32px;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 3a9 9 0 1 0 9 9c0-.46-.04-.92-.1-1.36a5.389 5.389 0 0 1-4.4 2.26 5.403 5.403 0 0 1-3.14-9.79c-.44-.07-.9-.11-1.36-.11z"/>
            <polygon points="18.5,4 19.5,6.5 22,7 20,9 20.5,11.5 18.5,10 16.5,11.5 17,9 15,7 17.5,6.5" />
          </svg>
        </div>
        <div class="brand-text" style="font-size: 1.15rem;">Nikah <span>Admin</span></div>
      </div>

      <nav class="admin-sidebar-nav">
        <a href="/pages/admin-dashboard.html" class="admin-nav-item">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
          <span>Dashboard</span>
        </a>

        <a href="/pages/members.html" class="admin-nav-item">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
          <span>Approved Members</span>
        </a>

        <a href="/pages/access-logs.html" class="admin-nav-item">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
          <span>Selfie Audit Logs</span>
        </a>

        <a href="/pages/media-manager.html" class="admin-nav-item">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2"/></svg>
          <span>Media Manager</span>
        </a>

        <a href="/pages/settings.html" class="admin-nav-item active">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
          <span>Settings</span>
        </a>
      </nav>

      <div class="admin-sidebar-footer">
        <a href="/" target="_blank" style="font-size: 0.8rem; color: var(--color-gold); text-decoration: none; display: flex; align-items: center; gap: 0.4rem;">
          <span>View Live Site</span>
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6M15 3h6v6M10 14L21 3"/></svg>
        </a>
        <button onclick="window.logoutAdmin()" style="background: none; border: none; font-size: 0.8rem; color: #FCA5A5; cursor: pointer;">
          Logout
        </button>
      </div>
    </aside>

    <!-- Main Content -->
    <div class="admin-main-content">
      <header class="admin-topbar">
        <div>
          <h2 style="font-size: 1.35rem; color: var(--color-ivory);">System & Security Settings</h2>
          <p style="font-size: 0.825rem; color: var(--color-text-muted);">Manage couple profile, credentials, and session lifetime</p>
        </div>
      </header>

      <main class="admin-body" style="max-width: 900px;">
        <!-- General Website Information Form -->
        <div class="glass-card" style="margin-bottom: 2rem;">
          <h3 style="font-size: 1.25rem; color: var(--color-ivory); margin-bottom: 1.25rem;">
            Wedding Details
          </h3>

          <form id="settingsForm">
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem;">
              <div class="form-group">
                <label class="form-label" for="settingWebsiteName">Website Name</label>
                <input type="text" id="settingWebsiteName" class="form-input" value="Our Nikah Memories" required />
              </div>

              <div class="form-group">
                <label class="form-label" for="settingCoupleNames">Bride & Groom Names</label>
                <input type="text" id="settingCoupleNames" class="form-input" value="Zayd & Aaliya" required />
              </div>
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem;">
              <div class="form-group">
                <label class="form-label" for="settingWeddingDate">Wedding Date</label>
                <input type="text" id="settingWeddingDate" class="form-input" value="November 1, 2026" required />
              </div>

              <div class="form-group">
                <label class="form-label" for="settingTimeout">Guest Session Timeout (Minutes)</label>
                <input type="number" id="settingTimeout" class="form-input" value="60" min="15" max="1440" required />
              </div>
            </div>

            <div style="margin-top: 1rem;">
              <button type="submit" class="btn-gold">
                Save Website Settings
              </button>
            </div>
          </form>
        </div>

        <!-- Security & Admin Password Form -->
        <div class="glass-card">
          <h3 style="font-size: 1.25rem; color: var(--color-ivory); margin-bottom: 1.25rem;">
            Admin Password & Authentication
          </h3>

          <form id="passwordForm">
            <div class="form-group">
              <label class="form-label" for="settingAdminEmail">Admin Email</label>
              <input type="email" id="settingAdminEmail" class="form-input" value="ahmadsalman9939@gmail.com" disabled />
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem;">
              <div class="form-group">
                <label class="form-label" for="settingNewPassword">New Password</label>
                <input type="password" id="settingNewPassword" class="form-input" placeholder="Enter at least 6 characters" minlength="6" />
              </div>

              <div class="form-group">
                <label class="form-label" for="settingConfirmPassword">Confirm New Password</label>
                <input type="password" id="settingConfirmPassword" class="form-input" placeholder="Confirm password" minlength="6" />
              </div>
            </div>

            <div style="margin-top: 1rem;">
              <button type="submit" class="btn-outline-gold">
                Update Admin Password
              </button>
            </div>
          </form>
        </div>
      </main>
    </div>
  </div>

  <script type="module" src="/js/app.js"></script>
  <script type="module">
    import { getAdminToken, requireAdminAccess } from '/js/auth.js';
    import { showToast, soundFX } from '/js/app.js';

    document.addEventListener('DOMContentLoaded', async () => {
      if (!requireAdminAccess()) return;
      const token = getAdminToken() || '';

      const settingsForm = document.getElementById('settingsForm');
      const passwordForm = document.getElementById('passwordForm');

      if (settingsForm) {
        settingsForm.addEventListener('submit', async (e) => {
          e.preventDefault();
          const websiteName = (document.getElementById('settingWebsiteName')).value.trim();
          const coupleNames = (document.getElementById('settingCoupleNames')).value.trim();
          const weddingDate = (document.getElementById('settingWeddingDate')).value.trim();
          const sessionTimeoutMinutes = (document.getElementById('settingTimeout')).value;

          try {
            const res = await fetch('/api/admin/settings', {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                Authorization: `Bearer ${token}`,
              },
              body: JSON.stringify({ websiteName, coupleNames, weddingDate, sessionTimeoutMinutes }),
            });

            const data = await res.json();
            if (res.ok && data.success) {
              soundFX.playChime();
              showToast('Website settings saved!', 'success');
            }
          } catch {
            showToast('Failed to save settings.', 'error');
          }
        });
      }

      if (passwordForm) {
        passwordForm.addEventListener('submit', async (e) => {
          e.preventDefault();
          const newPass = (document.getElementById('settingNewPassword')).value;
          const confirmPass = (document.getElementById('settingConfirmPassword')).value;

          if (!newPass || newPass !== confirmPass) {
            showToast('Passwords do not match or empty.', 'error');
            return;
          }

          try {
            const res = await fetch('/api/admin/settings', {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                Authorization: `Bearer ${token}`,
              },
              body: JSON.stringify({ adminPassword: newPass }),
            });

            const data = await res.json();
            if (res.ok && data.success) {
              soundFX.playChime();
              showToast('Admin password updated successfully!', 'success');
              (document.getElementById('settingNewPassword')).value = '';
              (document.getElementById('settingConfirmPassword')).value = '';
            }
          } catch {
            showToast('Failed to update password.', 'error');
          }
        });
      }
    });
  </script>
</body>
</html>
