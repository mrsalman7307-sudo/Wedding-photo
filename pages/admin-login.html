<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Portal Login – Our Nikah Memories</title>
  <meta name="description" content="Secure administrator access for wedding hosts." />
  
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="stylesheet" href="/css/animations.css" />
  <link rel="stylesheet" href="/css/responsive.css" />
</head>
<body>
  <div class="bg-islamic-pattern" aria-hidden="true"></div>
  <canvas id="goldParticlesCanvas" class="particles-canvas" style="position:fixed; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:0;"></canvas>

  <!-- Top Bar -->
  <header class="top-header">
    <div class="top-header-inner">
      <a href="/" class="brand-wordmark">
        <div class="brand-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 3a9 9 0 1 0 9 9c0-.46-.04-.92-.1-1.36a5.389 5.389 0 0 1-4.4 2.26 5.403 5.403 0 0 1-3.14-9.79c-.44-.07-.9-.11-1.36-.11z"/>
            <polygon points="18.5,4 19.5,6.5 22,7 20,9 20.5,11.5 18.5,10 16.5,11.5 17,9 15,7 17.5,6.5" />
          </svg>
        </div>
        <div class="brand-text">Our Nikah <span>Memories</span></div>
      </a>

      <div class="header-actions">
        <a href="/" class="btn-outline-gold">
          <span>&larr; Home</span>
        </a>
      </div>
    </div>
  </header>

  <main style="min-height: calc(100vh - 150px); display: flex; align-items: center; justify-content: center; padding: 3rem 1.5rem;">
    <div class="container" style="max-width: 480px;">
      <div class="glass-card reveal-fade-up">
        <div style="text-align: center; margin-bottom: 2rem;">
          <div style="width: 56px; height: 56px; border-radius: 50%; border: 1px solid var(--color-gold); background: rgba(212,175,55,0.12); color: var(--color-gold); display: flex; align-items: center; justify-content: center; margin: 0 auto 1rem auto;">
            <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
            </svg>
          </div>
          <h1 style="font-size: 1.8rem; color: var(--color-ivory); margin-bottom: 0.35rem;">
            Host Admin Portal
          </h1>
          <p style="font-size: 0.875rem; color: var(--color-text-secondary);">
            Sign in to manage approved contacts, view selfie audit logs, and upload wedding memories.
          </p>
        </div>

        <div id="adminLoginAlert" class="alert-box alert-danger" style="display: none;"></div>

        <form id="adminLoginForm">
          <div class="form-group">
            <label for="adminEmail" class="form-label">Admin Email</label>
            <input 
              type="email" 
              id="adminEmail" 
              class="form-input" 
              placeholder="Enter your email address" 
              required 
              autocomplete="email"
            />
          </div>

          <div class="form-group">
            <label for="adminPassword" class="form-label">Password</label>
            <input 
              type="password" 
              id="adminPassword" 
              class="form-input" 
              placeholder="••••••••••••" 
              required 
              autocomplete="current-password"
            />
          </div>

          <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.75rem;">
            <label style="display: flex; align-items: center; gap: 0.5rem; font-size: 0.85rem; color: var(--color-text-secondary); cursor: pointer;">
              <input type="checkbox" id="rememberMe" style="accent-color: var(--color-gold);" />
              <span>Remember me</span>
            </label>
          </div>

          <button type="submit" id="adminLoginSubmitBtn" class="btn-gold" style="width: 100%; padding: 0.85rem; font-size: 1rem;">
            <span>Enter Admin Dashboard</span>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M5 12h14M12 5l7 7-7 7"/>
            </svg>
          </button>
        </form>

        <div style="margin-top: 1.5rem; padding-top: 1.25rem; border-top: 1px solid rgba(212, 175, 55, 0.15); text-align: center; font-size: 0.8rem; color: var(--color-text-muted);">
          Protected Host Authentication · Authorized Personnel Only
        </div>
      </div>
    </div>
  </main>

  <script type="module" src="/js/app.js"></script>
  <script type="module">
    import { initAdminLogin } from '/js/admin.js';
    initAdminLogin();
  </script>
</body>
</html>
