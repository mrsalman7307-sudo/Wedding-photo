<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Portal Login – Our Nikah Memories</title>
  <meta name="description" content="Secure administrator access for wedding hosts." />
  
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="stylesheet" href="/css/animations.css" />
  <link rel="stylesheet" href="/css/responsive.css" />
</head>
<body>
  <div class="bg-islamic-pattern" aria-hidden="true"></div>

  <!-- Top Bar -->
  <header class="top-header">
    <div class="top-header-inner">
      <a href="/" class="brand-wordmark">
        <div class="brand-icon-mosque">
          <svg width="26" height="26" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M16 3 C16 3 9 9 9 17 L9 29 L23 29 L23 17 C23 9 16 3 16 3 Z" />
            <path d="M16 14 C16 14 12 18 12 23 L12 29 L20 29 L20 23 C20 18 16 14 16 14 Z" />
            <path d="M16 3 L16 1.5" />
            <circle cx="16" cy="1.2" r="0.8" fill="currentColor" />
          </svg>
        </div>
        <div class="brand-title-wrap">
          <span class="brand-line-1">Our Nikah</span>
          <span class="brand-line-2">Memories</span>
        </div>
      </a>

      <div class="header-actions">
        <a href="/" class="btn-outline-gold" style="font-size: 0.85rem; padding: 0.45rem 1rem;">
          <span>&larr; Home</span>
        </a>
      </div>
    </div>
  </header>

  <main style="min-height: calc(100vh - 150px); display: flex; align-items: center; justify-content: center; padding: 3rem 1.5rem;">
    <div class="container" style="max-width: 460px;">
      <div class="glass-card reveal-fade-up">
        <div style="text-align: center; margin-bottom: 2rem;">
          <div style="width: 58px; height: 58px; border-radius: 50%; border: 1.5px solid var(--color-border-gold); background: #FAF7F2; color: var(--color-primary); display: flex; align-items: center; justify-content: center; margin: 0 auto 1.25rem auto;">
            <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
            </svg>
          </div>
          <h1 style="font-size: 1.8rem; color: var(--color-primary); margin-bottom: 0.35rem;">
            Host Admin Portal
          </h1>
          <p style="font-size: 0.875rem; color: var(--color-text-body);">
            Sign in to manage approved guest contacts, view selfie audit logs, and manage wedding galleries.
          </p>
        </div>

        <div id="adminLoginAlert" class="alert-box alert-danger" style="display: none;"></div>

        <form id="adminLoginForm">
          <div class="form-group">
            <label for="adminEmail" class="form-label">Email Address</label>
            <input 
              type="email" 
              id="adminEmail" 
              class="form-input" 
              placeholder="ahmadsalman9939@gmail.com" 
              required 
              autocomplete="email"
            />
          </div>

          <div class="form-group">
            <label for="adminPassword" class="form-label">Password</label>
            <input 
              type="password" 
              id="adminPassword" 
              class="form-input" 
              placeholder="admin@123" 
              required 
              autocomplete="current-password"
            />
          </div>

          <div style="margin-top: 0.75rem; margin-bottom: 1.25rem; display: flex; align-items: center; justify-content: space-between; font-size: 0.8rem; background: rgba(197, 160, 89, 0.1); border: 1px dashed rgba(197, 160, 89, 0.4); padding: 0.5rem 0.75rem; border-radius: 8px;">
            <span style="color: var(--color-primary); font-weight: 500;">
              🔑 <strong>Admin:</strong> ahmadsalman9939@gmail.com
            </span>
            <button type="button" id="quickFillBtn" style="background: none; border: none; color: var(--color-gold-script); text-decoration: underline; cursor: pointer; font-weight: 600; font-size: 0.8rem;">Auto-fill</button>
          </div>

          <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.5rem;">
            <label style="display: flex; align-items: center; gap: 0.5rem; font-size: 0.85rem; color: var(--color-text-body); cursor: pointer;">
              <input type="checkbox" id="rememberMe" checked style="accent-color: var(--color-primary);" />
              <span>Remember me</span>
            </label>
            <span style="font-size: 0.8rem; color: var(--color-gold-script);">Host Protected</span>
          </div>

          <button type="submit" id="adminLoginSubmitBtn" class="btn-gold" style="width: 100%; padding: 0.85rem; font-size: 1rem;">
            <span>Sign In to Dashboard</span>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M5 12h14M12 5l7 7-7 7"/>
            </svg>
          </button>
        </form>

        <div style="margin-top: 1.5rem; padding-top: 1.25rem; border-top: 1px solid rgba(197, 160, 89, 0.2); text-align: center; font-size: 0.82rem; color: var(--color-text-muted);">
          Protected Host Authentication · Authorized Access Only
        </div>

        <!-- Created by Salman Credit -->
        <div style="margin-top: 1.25rem; text-align: center;">
          <div class="creator-showcase-badge" style="background: rgba(12, 56, 41, 0.08); border-color: rgba(197, 160, 89, 0.5); color: var(--color-primary);">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="#C5A059" stroke="#C5A059">
              <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
            </svg>
            <span style="font-size: 0.85rem; color: var(--color-primary);">Created with Love by <strong style="color: var(--color-gold-script); font-weight: 700;">Salman</strong></span>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script type="module" src="/js/app.js"></script>
  <script type="module" src="/js/auth.js"></script>
  <script type="module">
    import { initAdminLogin } from '/js/admin.js';
    initAdminLogin();

    document.getElementById('quickFillBtn')?.addEventListener('click', () => {
      const emailInput = document.getElementById('adminEmail');
      const passInput = document.getElementById('adminPassword');
      if (emailInput) emailInput.value = 'ahmadsalman9939@gmail.com';
      if (passInput) passInput.value = 'admin@123';
    });
  </script>
</body>
</html>
